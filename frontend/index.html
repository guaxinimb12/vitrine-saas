<h1>Marketplace</h1>

<div id="products"></div>

<script>

fetch("/api/products")
.then(r=>r.json())
.then(data=>{

const container = document.getElementById("products")

data.forEach(p=>{

container.innerHTML += `
<div style="border:1px solid #ccc;margin:10px;padding:10px">

<h2>${p.name}</h2>
<p>${p.price}</p>

<a href="${p.link}" target="_blank">
Comprar
</a>

</div>
`

})

})

</script>
