<h1>Marketplace</h1>

<div id="products"></div>

<script>

fetch("/api/products")
.then(r=>r.json())
.then(data=>{

const container = document.getElementById("products")

data.forEach(p=>{

container.innerHTML += `
<div>

<h2>${p.name}</h2>
<p>${p.price}</p>

<a href="/produto/${p.slug}">
Ver produto
</a>

</div>
`

})

})

</script>
