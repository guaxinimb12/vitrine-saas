<h1>Painel Admin</h1>
<!DOCTYPE html>
<html>
<head>
<title>Minha Compra</title>
</head>

<body>

<h1>🚀 Minha Compra</h1>
<p>Marketplace inteligente com IA</p>

</body>
</html>
<input id="name" placeholder="Produto">
<input id="price" placeholder="Preço">
<input id="link" placeholder="Link afiliado">

<button onclick="add()">Adicionar</button>

<script>

function add(){

fetch("/api/products",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:document.getElementById("name").value,
price:document.getElementById("price").value,
link:document.getElementById("link").value

})

})

}

</script>
